services:
  db:
    image: postgres:16-alpine
    container_name: refuel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: refuel
    ports:
      - "5432:5432"
    volumes:
      - refuel-pgdata:/var/lib/postgresql/data

volumes:
  refuel-pgdata:
